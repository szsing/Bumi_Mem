[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bumi-mem"
version = "0.6.0"
description = "Layered session and long-term memory for companion agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mem0ai==2.0.20",
  "openai>=2",
  "transformers>=5",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "filelock>=3.13"]
client = ["httpx>=0.27,<1"]
runtime = ["sentence-transformers>=5.2,<7", "fastembed>=0.3.1,<1", "spacy>=3.7,<4"]
test = ["pytest>=8", "fastapi>=0.115,<1", "httpx>=0.27,<1", "filelock>=3.13"]

[project.scripts]
bumi-mem-chat = "bumi_mem.cli:main"
bumi-memory-server = "bumi_mem.api:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bumi_mem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/mem0-new"]
