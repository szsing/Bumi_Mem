[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bumi-mem"
version = "0.1.0"
description = "Layered session and long-term memory for companion agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mem0ai==2.0.20",
  "openai>=2",
  "transformers>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bumi-mem-chat = "bumi_mem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bumi_mem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/mem0-new"]
