<style>

<header><div><small>BUMI / MEMORY STUDIO</small><h1>记忆管理</h1><small>查看所有用户 · 修订事实 · 保留来源</small></div><form class="login" id="login"><input id="key" type="password" placeholder="输入服务密钥" autocomplete="off" aria-label="服务密钥"><button class="primary">连接</button></form></header>
<div class="shell"><aside><div class="meta">用户与机器人分组</div><div id="groups"><p class="muted">连接后加载用户列表</p></div></aside><main><div class="toolbar"><input id="search" placeholder="搜索记忆内容…" aria-label="搜索记忆"><select id="status" aria-label="状态"><option value="active">当前可用</option><option value="deleted">已删除</option><option value="all">全部状态</option></select><button id="refresh">刷新</button></div><div id="notice" role="status">请输入现有记忆服务密钥，开始查看。</div><div class="toolbar"><button id="listView" class="primary">记忆列表</button><button id="graphView">三维知识图谱</button></div><section id="graphSection" hidden><div class="toolbar"><label><input type="checkbox" id="showEpisodes" checked> 对话片段</label><label><input type="checkbox" id="showCommunities" checked> 社区</label><label><input type="checkbox" id="showLabels" checked> 显示名称</label><button id="resetGraph">重置视角</button></div><div id="graphLayout"><div id="graphStage"><canvas id="graphCanvas" aria-label="可旋转缩放的三维知识图谱"></canvas><div id="graphHint">拖动旋转 · 滚轮缩放 · 点击节点或连线查看</div></div><div id="graphInfo"><h2>知识图谱</h2><p class="muted">选择节点查看内容，点击事实连线可进入编辑。</p><p><span class="legend" style="background:#3d9179"></span> 实体</p><p><span class="legend" style="background:#dcad61"></span> 对话片段</p><p><span class="legend" style="background:#8781be"></span> 社区</p></div></div></section><div class="summary" id="summary"></div><div id="cards" class="cards"></div><div class="pager"><button id="prev" disabled>上一页</button><span id="page" class="muted"></span><button id="next" disabled>下一页</button></div></main></div>
<dialog id="detail"><div class="dialoghead"><h2>记忆详情</h2><button id="close">关闭</button></div><p class="tiny muted" id="identity"></p><label for="content">事实内容</label><textarea id="content" maxlength="8000"></textarea><p class="muted tiny">修改会更新该事实的向量并记录历史。删除为可恢复的逻辑删除，原始聊天不会一并删除。存在手动修订时，该分组暂不使用旧实体摘要、对话片段与社区摘要参与召回。</p><div class="actions"><button id="save" class="primary">保存修改</button><button id="remove" class="danger">删除记忆</button><button id="restore">恢复记忆</button></div><div id="editNotice" role="status"></div><details open><summary>原始来源</summary><div id="sources"></div></details><details><summary>修订历史</summary><div id="history"></div></details></dialog>
<script>
const $=id=>document.getElementById(id);let view='list';let token='',groups=[],group=null,offset=0,total=0,selected=null,busy=false,sequence=0;const limit=30;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function tell(text,error=false,target='notice'){$(target).textContent=text;$(target).className=error?'error':''}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});let d;try{d=await r.json()}catch{throw Error('服务返回了无法读取的响应')}if(!r.ok){const c=d.detail?.code;throw Error(c==='unauthorized'?'密钥不正确':c==='version_conflict'?'内容已被其他操作修改，请关闭并重新打开':c==='memory_not_found'?'这条记忆已不存在':c==='graphiti_required'?'当前服务不是 Graphiti 后端':c==='invalid_edit'?'内容不能为空，且不能超过8000字符':'请求失败（'+r.status+'）')}return d}
function groupLabel(g){return g.user_id||g.group_id.slice(0,20)+'…'}
function renderGroups(){const box=$('groups');box.replaceChildren();let all=node('button','所有用户','group'+(group===null?' active':''));all.onclick=()=>choose(null);box.append(all);for(const g of groups){const b=node('button',undefined,'group'+(group===g.group_id?' active':''));b.append(node('div',groupLabel(g)),node('small',(g.agent_id||'未识别机器人')+' · '+g.facts+'条事实'));b.title=g.group_id;b.onclick=()=>choose(g.group_id);box.append(b)}}
function choose(id){group=id;offset=0;renderGroups();load()}
async function load(){if(view==='graph')return loadGraph();const seq=++sequence;tell('正在读取…');$('prev').disabled=true;$('next').disabled=true;try{const q=new URLSearchParams({q:$('search').value,status:$('status').value,offset,limit});if(group)q.set('group_id',group);const d=await api('/v1/admin/memories?'+q);if(seq!==sequence)return;total=d.total;$('summary').textContent=(group===null?'所有用户':groupLabel(groups.find(g=>g.group_id===group)||{group_id:group}))+' · '+total+' 条记忆';const box=$('cards');box.replaceChildren();if(!d.items.length)box.append(node('div','没有符合条件的记忆','empty'));for(const item of d.items){const c=node('article',undefined,'card');c.tabIndex=0;c.setAttribute('role','button');c.append(node('span',item.deleted?'已删除':item.version?'已修订':'自动提取','badge'+(item.deleted?' deleted':'')),node('div',item.content,'fact'));const m=node('div',undefined,'meta');m.append(node('span',(item.source||'实体')+' → '+(item.target||'实体')),node('span',groupLabel(groups.find(g=>g.group_id===item.group_id)||{group_id:item.group_id})),node('span',item.valid_at||'未标注时间'));c.append(m);c.onclick=()=>openDetail(item);c.onkeydown=e=>{if(e.key==='Enter')openDetail(item)};box.append(c)}$('page').textContent=total?(offset+1)+'–'+Math.min(offset+limit,total)+' / '+total:'0 条';$('prev').disabled=offset===0;$('next').disabled=offset+limit>=total;tell('已更新')}catch(e){if(seq===sequence)tell(e.message,true)}}
async function openDetail(item){tell('正在加载…',false,'editNotice');try{selected=await api('/v1/admin/memories/'+encodeURIComponent(item.id)+'?'+new URLSearchParams({group_id:item.group_id}));$('content').value=selected.content;$('identity').textContent=selected.group_id+' / '+selected.id+' / 版本 '+selected.version;$('remove').hidden=selected.deleted;$('restore').hidden=!selected.deleted;const sources=$('sources');sources.replaceChildren();for(const s of selected.sources)sources.append(node('pre',s.content));if(!selected.sources.length)sources.append(node('p','暂无可读取的来源片段','muted'));$('history').replaceChildren(...selected.history.map(h=>node('pre',h.at+' · '+h.action+' · 版本 '+h.version+'\n修改前：'+h.before+'\n修改后：'+h.after)));tell('',false,'editNotice');if(!$('detail').open)$('detail').showModal()}catch(e){tell(e.message,true)}}
async function change(action){if(busy||!selected)return;if(action==='delete'&&!confirm('删除这条记忆？删除后不会用于新的长期召回，可在“已删除”中恢复。'))return;busy=true;for(const id of ['save','remove','restore','close'])$(id).disabled=true;try{const body={group_id:selected.group_id,version:selected.version,action};if(action==='edit')body.content=$('content').value;await api('/v1/admin/memories/'+encodeURIComponent(selected.id),{method:'PATCH',body:JSON.stringify(body)});$('detail').close();await load();tell(action==='delete'?'已删除，可在已删除列表中恢复':action==='restore'?'已恢复':'修改已保存')}catch(e){tell(e.message,true,'editNotice')}finally{busy=false;for(const id of ['save','remove','restore','close'])$(id).disabled=false}}
$('login').onsubmit=async e=>{e.preventDefault();token=$('key').value.trim();if(!token)return;tell('正在连接…');try{groups=(await api('/v1/admin/groups')).items;renderGroups();await load()}catch(e){tell(e.message,true)}};$('refresh').onclick=()=>load();$('status').onchange=()=>{offset=0;load()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{offset=0;load()},350)};$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};$('close').onclick=()=>$('detail').close();$('save').onclick=()=>change('edit');$('remove').onclick=()=>change('delete');$('restore').onclick=()=>change('restore');$('detail').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
</script><script>
let graphData={nodes:[],edges:[]},graphNodes=[],graphEdges=[],projected=[],selectedGraph=null,graphSequence=0;
let yaw=.55,pitch=-.3,distance=950,drag=null,moved=false,physics=0;
const canvas=$('graphCanvas'),ctx=canvas.getContext('2d');
const colors={entity:'#53b79a',episode:'#e5b76b',community:'#a096da'};
const kindNames={entity:'实体',episode:'对话片段',community:'社区'};
function keyOf(n){return n.group_id+'::'+n.id}
function switchView(next){view=next;$('graphSection').hidden=next!=='graph';$('cards').hidden=next==='graph';$('summary').hidden=next==='graph';$('prev').parentElement.hidden=next==='graph';$('listView').classList.toggle('primary',next==='list');$('graphView').classList.toggle('primary',next==='graph');$('status').disabled=next==='graph';$('search').placeholder=next==='graph'?'在当前图谱中搜索节点或事实…':'搜索记忆内容…';if(token)load();if(next==='graph')resizeGraph()}
$('listView').onclick=()=>switchView('list');$('graphView').onclick=()=>switchView('graph');
async function loadGraph(){const seq=++graphSequence;if(!token){tell('请先输入服务密钥连接');return}tell('正在读取图谱…');try{const q=new URLSearchParams({limit:500});if(group)q.set('group_id',group);const data=await api('/v1/admin/graph?'+q);if(seq!==graphSequence||view!=='graph')return;graphData=data;buildGraph();tell(data.nodes.length+' 个节点 · '+data.edges.length+' 条连线'+(data.truncated?' · 当前为部分图谱，选择具体用户可查看更完整内容':''));showGraphIntro()}catch(e){if(seq===graphSequence)tell(e.message,true)}}
function buildGraph(){const visible=graphData.nodes.filter(n=>(n.kind!=='episode'||$('showEpisodes').checked)&&(n.kind!=='community'||$('showCommunities').checked));const golden=Math.PI*(3-Math.sqrt(5));graphNodes=visible.map((n,i)=>{const y=1-2*(i+.5)/Math.max(1,visible.length),r=Math.sqrt(Math.max(0,1-y*y));return {...n,key:keyOf(n),x:280*r*Math.cos(golden*i),y:280*y,z:280*r*Math.sin(golden*i),vx:0,vy:0,vz:0}});const map=new Map(graphNodes.map(n=>[n.key,n]));graphEdges=graphData.edges.map(e=>({...e,a:map.get(e.group_id+'::'+e.source),b:map.get(e.group_id+'::'+e.target)})).filter(e=>e.a&&e.b);selectedGraph=null;physics=110;resizeGraph()}
function resizeGraph(){if(!canvas||view!=='graph')return;const box=canvas.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(box.width*ratio));canvas.height=Math.max(1,Math.round(box.height*ratio));ctx.setTransform(ratio,0,0,ratio,0,0)}
window.addEventListener('resize',resizeGraph);$('showEpisodes').onchange=buildGraph;$('showCommunities').onchange=buildGraph;$('resetGraph').onclick=()=>{yaw=.55;pitch=-.3;distance=950;selectedGraph=null;showGraphIntro()};
function stepPhysics(){for(const n of graphNodes){n.vx-=n.x*.0009;n.vy-=n.y*.0009;n.vz-=n.z*.0009}for(let i=0;i<graphNodes.length;i++)for(let j=i+1;j<graphNodes.length;j++){const a=graphNodes[i],b=graphNodes[j],dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z,d2=dx*dx+dy*dy+dz*dz+100,f=55/(d2*Math.sqrt(d2));a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f;b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f}for(const e of graphEdges){const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,dz=e.b.z-e.a.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1,f=(d-100)*.0018/d;e.a.vx+=dx*f;e.a.vy+=dy*f;e.a.vz+=dz*f;e.b.vx-=dx*f;e.b.vy-=dy*f;e.b.vz-=dz*f}for(const n of graphNodes){n.vx*=.8;n.vy*=.8;n.vz*=.8;n.x+=n.vx;n.y+=n.vy;n.z+=n.vz}}
function project(n,w,h){const cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch),x=n.x*cy+n.z*sy,z0=-n.x*sy+n.z*cy,y=n.y*cx-z0*sx,z=n.y*sx+z0*cx;const scale=distance/(distance+z),zoom=950/distance;return {...n,sx:w/2+x*scale*zoom,sy:h/2+y*scale*zoom,depth:z,size:(n.kind==='community'?9:n.kind==='episode'?7:5.5)*scale*zoom}}
function matchGraph(item,q){return !q||String(item.name||'').toLowerCase().includes(q)||String(item.description||item.content||'').toLowerCase().includes(q)}
function drawGraph(){requestAnimationFrame(drawGraph);if(view!=='graph'||document.hidden)return;if(physics>0){stepPhysics();physics--}const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);projected=graphNodes.map(n=>project(n,w,h));const points=new Map(projected.map(n=>[n.key,n])),q=$('search').value.trim().toLowerCase();for(const e of graphEdges){const a=points.get(e.a.key),b=points.get(e.b.key),highlight=(selectedGraph&&(selectedGraph.key===a.key||selectedGraph.key===b.key||selectedGraph.id===e.id))||(q&&matchGraph(e,q));ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.strokeStyle=highlight?'rgba(228,220,161,.88)':e.kind==='RELATES_TO'?'rgba(116,188,166,.38)':'rgba(146,163,173,.18)';ctx.lineWidth=highlight?1.7:.7;ctx.stroke()}projected.sort((a,b)=>b.depth-a.depth);for(const n of projected){const selected=selectedGraph?.key===n.key,matched=matchGraph(n,q),alpha=q&&!matched ? .2 : 1;ctx.globalAlpha=alpha;const radius=Math.max(2,n.size),g=ctx.createRadialGradient(n.sx-radius*.3,n.sy-radius*.4,radius*.1,n.sx,n.sy,radius);g.addColorStop(0,'#e5fff3');g.addColorStop(.3,colors[n.kind]||colors.entity);g.addColorStop(1,'#153d34');ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.sx,n.sy,radius,0,Math.PI*2);ctx.fill();if(selected||q&&matched){ctx.strokeStyle='#fcdf91';ctx.lineWidth=2;ctx.stroke()}if($('showLabels').checked&&(n.kind==='entity'||selected||q&&matched)){ctx.font=Math.max(10,Math.min(14,11*n.size/5.5))+'px system-ui';ctx.fillStyle='#d9eee5';ctx.fillText(String(n.name||kindNames[n.kind]||'节点').slice(0,25),n.sx+radius+4,n.sy+3)}ctx.globalAlpha=1}if(!graphNodes.length){ctx.fillStyle='#c8ded4';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText('当前分组没有可显示的图谱',w/2,h/2);ctx.textAlign='left'}}
function showGraphIntro(){const box=$('graphInfo');box.replaceChildren(node('h2','三维知识图谱'),node('p','拖动旋转，滚轮缩放。点击节点查看内容，点击连线查看关系。','muted'));for(const kind of ['entity','episode','community']){const row=node('p');const dot=node('span',undefined,'legend');dot.style.background=colors[kind];row.append(dot,node('span',kindNames[kind]));box.append(row)}box.append(node('p','空间距离仅用于布局，不代表事实强度。','tiny muted'))}
function edgeInfo(e){selectedGraph=e;const box=$('graphInfo');box.replaceChildren(node('h2',e.kind==='RELATES_TO'?'事实关系':e.kind==='MENTIONS'?'来源提及':'社区成员'),node('p',(e.a.name||'节点')+' → '+(e.b.name||'节点')),node('pre',e.content||e.name||e.kind));if(e.kind==='RELATES_TO'){const edit=node('button','查看来源 / 编辑事实','primary');edit.onclick=()=>openDetail({id:e.id,group_id:e.group_id});box.append(edit)}else box.append(node('p','这条连线表示来源或归属，不是可编辑的事实文字。','tiny muted'))}
function nodeInfo(n){selectedGraph=n;const box=$('graphInfo');box.replaceChildren(node('h2',n.name||kindNames[n.kind]),node('p',kindNames[n.kind]+' · '+groupLabel(groups.find(g=>g.group_id===n.group_id)||{group_id:n.group_id}),'muted'),node('pre',n.description||'此节点暂无摘要'));box.append(node('p','相邻关系','muted'));const adjacent=graphEdges.filter(e=>e.a.key===n.key||e.b.key===n.key);for(const e of adjacent.slice(0,20)){const b=node('button',(e.kind==='RELATES_TO'?'事实：':'')+(e.content||e.name||e.kind).slice(0,70),'group');b.onclick=()=>edgeInfo(e);box.append(b)}if(adjacent.length>20)box.append(node('p','仅显示前20条相邻关系','tiny muted'));box.append(node('p',n.group_id+' / '+n.id,'tiny muted'))}
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};moved=false;canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing'};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>4)moved=true;yaw+=dx*.007;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.007));drag.x=e.clientX;drag.y=e.clientY};canvas.onpointerup=e=>{canvas.style.cursor='grab';if(!moved){const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;const n=projected.slice().reverse().find(n=>Math.hypot(n.sx-x,n.sy-y)<n.size+6);if(n)nodeInfo(n);else{const map=new Map(projected.map(n=>[n.key,n]));let best=null,bestD=6;for(const edge of graphEdges){const a=map.get(edge.a.key),b=map.get(edge.b.key),dx=b.sx-a.sx,dy=b.sy-a.sy,t=Math.max(0,Math.min(1,((x-a.sx)*dx+(y-a.sy)*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(x-a.sx-t*dx,y-a.sy-t*dy);if(d<bestD){best=edge;bestD=d}}if(best)edgeInfo(best)}}drag=null};canvas.onpointercancel=()=>{drag=null;canvas.style.cursor='grab'};canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(450,Math.min(1900,distance*Math.exp(e.deltaY*.001)))},{passive:false});
requestAnimationFrame(drawGraph);
