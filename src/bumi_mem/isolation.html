<!doctype html>
<!-- 本次改动（2026-10-21）：新增注册、身份切换、文字交互和共同事实隐藏/异议/修改/撤回测试台。 --><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户长期记忆隔离测试</title>
<style>body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 16px;background:#f4f7fa;color:#16304b}input,textarea,button{font:inherit;padding:9px;margin:5px 0}input,textarea{width:100%;box-sizing:border-box}section,article,pre{background:white;padding:16px;border-radius:8px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}small{display:block;color:#52677b}</style>
<h1>用户长期记忆隔离测试</h1><p>长期材料按当前注册身份返回。短期对话仍然共享，陌生人统一为 __guest__ 并写入 SQLite。</p>
<label>服务密钥（可信 Agent / 管理员；不要交给终端用户）<input id="key" type="password" autocomplete="off"></label><small>密钥只保留在页面内存，不写浏览器存储。</small>
<section><h2>注册用户</h2><input id="registerId" placeholder="user1"><input id="name" placeholder="显示名称，例如小王"><input id="aliases" placeholder="别名，使用中文或英文逗号分隔"><button id="register">注册 / 更新</button><button id="users">查看注册表</button></section>
<section><h2>模拟 Agent 对话</h2><input id="user" value="user1" placeholder="当前用户 ID；未注册 ID 将映射为陌生人"><textarea id="query" placeholder="例如：我和小李是朋友。"></textarea><textarea id="reply" placeholder="上一轮已输出的助手回复；可留空"></textarea><button id="send">发送</button><button id="settle">只补存上一轮回复</button><button id="retry">重试上次请求</button><button id="shared">查看当前用户共同事实</button></section>
<div id="facts"></div><pre id="out">等待请求</pre>
<script>
const el=id=>document.getElementById(id);let lastBody=null;
async function call(path,method='GET',body=null){const response=await fetch(path,{method,headers:{'Authorization':'Bearer '+el('key').value,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();el('out').textContent=JSON.stringify(data,null,2);if(!response.ok)throw new Error('HTTP '+response.status);return data}
const showError=error=>{el('out').textContent+='\n'+String(error)};
async function list(){const user=el('user').value;const data=await call('/v2/memory/shared?user_id='+encodeURIComponent(user));el('facts').replaceChildren();for(const fact of data.items){const box=document.createElement('article'),text=document.createElement('p');text.textContent=fact.content+'；来源 '+fact.owner_id+'；版本 '+fact.version+(fact.hidden?'；已对我隐藏':'')+(fact.disputed?'；我已提出异议':'');box.append(text);for(const action of [fact.hidden?'unhide':'hide','dispute',...(fact.owner_id===user?['edit','withdraw']:[])]){const button=document.createElement('button');button.textContent={hide:'对我隐藏',unhide:'取消隐藏',dispute:'提出异议',edit:'修改我的陈述',withdraw:'撤回我的陈述'}[action];button.onclick=async()=>{let content=null;if(action==='edit'){content=prompt('修改共享陈述（参与者保持不变）',fact.content);if(!content)return}if(['edit','withdraw'].includes(action)&&!confirm('操作会屏蔽原始来源及其关联图谱批次，可能影响同一批次的其他私人事实。聊天原文保留。确认继续？'))return;try{await call('/v2/memory/shared/'+encodeURIComponent(fact.id),'PATCH',{user_id:user,version:fact.version,action,content,confirm_source_scope:true});await list()}catch(error){showError(error)}};box.append(button)}el('facts').append(box)}}
el('register').onclick=()=>call('/v2/admin/users','PUT',{user_id:el('registerId').value,display_name:el('name').value,aliases:el('aliases').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),active:true}).catch(showError);
el('users').onclick=()=>call('/v2/admin/users').catch(showError);el('shared').onclick=()=>list().catch(showError);
function send(settle){el('facts').replaceChildren();lastBody={turn_id:crypto.randomUUID(),user_id:el('user').value,query:settle?null:el('query').value,previous_ai_reply:el('reply').value||null};return call('/v1/memory/context','POST',lastBody)}
el('send').onclick=()=>send(false).catch(showError);el('settle').onclick=()=>send(true).catch(showError);el('retry').onclick=()=>lastBody&&call('/v1/memory/context','POST',lastBody).catch(showError);
</script></html>
