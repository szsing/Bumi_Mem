services:
  neo4j:
    image: neo4j:5.26.0-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BUMI_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${BUMI_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${BUMI_NEO4J_PASSWORD:?Set BUMI_NEO4J_PASSWORD}"
    volumes:
      - "${BUMI_NEO4J_DATA_DIR:?Set a NEW Neo4j data directory}:/data"
